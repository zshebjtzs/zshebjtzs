# Presentation tokens and module order.
# Content is stored in profile/*.yml; renderers consume these semantic tokens.
presentation:
  username: zshebjtzs
  theme: tech-dawn
  visual_direction: Tech-Dawn & Open-Source Minimalist
  page_bg: "0B1724"
  accent: "79D7D0"
  secondary_accent: "E8A56D"
  title_color: "DCE5EC"
  text_color: "D7E0E8"
  muted_color: "91A4B5"
  panel_color: "102235"
  panel_alt_color: "142B40"
  border_color: "2B4052"
  project_columns: 3
  visual_assets:
    hero: assets/profile/hero.svg
    about_zh: assets/profile/about.zh.svg
    about_en: assets/profile/about.en.svg
    focus_zh: assets/profile/focus.zh.svg
    focus_en: assets/profile/focus.en.svg
  stats_cache: data/stats.json
modules:
  - id: about
    enabled: true
  - id: focus
    enabled: true
  - id: github_activity
    enabled: true
  - id: featured_projects
    enabled: true
  - id: other_projects
    enabled: true
  - id: contributions
    enabled: true
  - id: highlights
    enabled: true
  - id: milestones
    enabled: true
  - id: tech_stack
    enabled: true
  - id: activity_archive
    enabled: true
