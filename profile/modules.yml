  - id: featured_projects
    enabled: true
  - id: other_projects
    enabled: true
  - id: contributions
    enabled: true
  - id: highlights
    enabled: true
  - id: milestones
    enabled: true
  - id: tech_stack
    enabled: true
  - id: activity_archive
    enabled: true
