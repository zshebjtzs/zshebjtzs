profile:
  language: zh-CN
  default_language: zh-CN
  supported_languages:
    - zh-CN
    - en
  visual_direction: Tech-Dawn & Open-Source Minimalist
  palette:
    base:
      - deep-sea-blue
      - cool-silver-gray
    accents:
      - soft-cyan
      - sunrise-orange
  layout:
    featured_projects: 3
    recent_highlights: 5
    show_activity_archive: true
    show_milestones: true
  privacy:
    show_email: false
    show_school: false
    show_precise_location: false
    show_age: false

# Categories describe technology domains, not proficiency claims.
tech_stack:
  Languages:
    - C++
    - JavaScript
    - TypeScript
    - HTML5
    - CSS3
  Frameworks & Runtime:
    - Vue 3
    - Node.js
    - Express
    - Vite
    - Naive UI
    - Neutralinojs
    - VitePress
  Tools & Infrastructure:
    - Git
    - GitHub
    - GitHub Actions
    - GitHub Pages
  Graphics & Data:
    - Canvas 2D
    - d3-delaunay
    - MySQL
    - JWT
    - Vditor
    - Web Worker

automation:
  collect_schedule: weekly
  collect_scope:
    - owned_public_repositories
    - authored_public_pull_requests
    - authored_public_issues
    - public_github_events
  require_human_review_before_publication: true
