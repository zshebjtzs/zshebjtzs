      - Per-Skill previews and ZIP downloads
      - Automated validation and deployment workflows

  - id: biliflow
    name: BiliFlow
    repository: https://github.com/zshebjtzs/BiliFlow
    demo: null
    visibility: featured
    project_type: Personal Project
    development_status: In Development
    description: >-
      A lightweight Windows desktop GUI for yt-dlp, built with Vue 3, TypeScript,
      Vite, Naive UI, and Neutralinojs. The desktop shell and base interface are
      in place; download and media-processing features are not yet integrated.
    description_zh: >-
      基于 Vue 3、TypeScript、Vite、Naive UI 与 Neutralinojs 构建的轻量 Windows yt-dlp 桌面 GUI。目前已完成桌面外壳与基础界面，下载及媒体处理功能尚未集成。
    highlights_zh:
      - 轻量级 Windows 桌面外壳
      - 基于 Vue 的界面与开发工作流
      - 支持便携式桌面打包
    technologies:
      - Vue 3
      - TypeScript
      - Vite
      - Naive UI
      - Neutralinojs
    highlights:
      - Lightweight Windows desktop shell
      - Vue-based interface and development workflow
      - Portable desktop packaging

