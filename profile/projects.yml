# visibility controls presentation; development_status describes project state.
# These are intentionally separate fields.
projects:
  - id: tree-grow-game
    name: "TreeGrow — Growth Tree: Graph Theory"
    repository: https://github.com/zshebjtzs/tree-grow-game
    demo: https://zshebjtzs.github.io/tree-grow-game/
    visibility: featured
    project_type: Personal Project
    development_status: Maintained
    description: >-
      A browser-based strategy game built around graph topology and tree growth,
      featuring procedural Voronoi maps, PVP/PVE, interactive tutorials, save/load,
      and asynchronous AI decision-making.
    description_zh: >-
      一款围绕图结构与树生长机制设计的浏览器策略游戏，包含程序化 Voronoi 地图、PVP/PVE、交互式教程、存档读档与异步 AI 决策。
    highlights_zh:
      - 程序化生成 Voronoi 地图并构建图邻接关系
      - 模块化实现游戏状态、规则校验、战斗结算与渲染
      - AI 搜索采用迭代加深、Alpha-Beta/PVS 与置换表
      - 提供六档 AI 难度，并控制搜索预算
      - 支持 GitHub Pages 部署与 Windows 离线桌面分发
    technologies:
      - JavaScript
      - HTML5
      - CSS3
      - Canvas 2D
      - d3-delaunay
      - Web Worker
      - Vite
    highlights:
      - Procedural Voronoi map generation and graph adjacency construction
      - Modular game state, rule validation, combat resolution, and rendering
      - AI search with iterative deepening, Alpha-Beta/PVS, and transposition tables
      - Six AI difficulty levels with bounded search budgets
      - GitHub Pages deployment and Windows offline distribution

