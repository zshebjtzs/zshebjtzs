    description_zh: >-
      版本化管理的可复用 Agent Skills 库，配套双语检索门户，支持个人、社区、共享及外部来源的 Skills。
    highlights_zh:
      - 双语文档门户与全文检索
      - 声明式外部 Skill 目录及来源归属追踪
      - 支持单个 Skill 预览与 ZIP 下载
      - 通过自动化工作流执行校验与部署
