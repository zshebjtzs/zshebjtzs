name: Validate and publish profile

on:
  pull_request:
    branches: [main]
    paths:
      - "profile/**"
      - "activity/records.yml"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/publish-profile.yml"
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "activity/records.yml"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/publish-profile.yml"
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile scripts/*.py
      - name: Collect public GitHub statistics
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: zshebjtzs
        run: python scripts/collect_stats.py
      - name: Validate reviewed data
        run: python scripts/validate_data.py
      - name: Generate visual components
        run: python scripts/generate_visuals.py
      - name: Generate bilingual profile
        run: python scripts/generate_profile.py
      - name: Commit generated files
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh bilingual profile visuals and stats"
          file_pattern: README.md README.en.md activity/ACTIVITY.md activity/ACTIVITY.en.md assets/badges/*.svg assets/profile/*.svg assets/stats/*.svg data/stats.json data/tech-badges.json
